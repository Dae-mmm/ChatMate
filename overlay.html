<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatMate · overlay</title>
  <link rel="stylesheet" href="/overlay.css">
</head>
<body>
  <!-- Palco 1920×1080, scalato per riempire la Browser Source di OBS -->
  <div id="stage" class="stage">
    <div class="boardBox">
      <div id="board" class="board"></div>
      <svg id="arrows" class="arrows" viewBox="0 0 800 800"></svg>
      <div id="banner" class="banner" hidden></div>
    </div>

    <div class="panel">
      <div class="players">
        <div class="pl" id="plChat"></div>
        <div class="vs">vs</div>
        <div class="pl" id="plLlm"></div>
      </div>

      <div class="phaseBox">
        <div id="phase" class="phase"></div>
        <div id="sub" class="sub"></div>
      </div>

      <!-- Timer a cerchio in una colonna, chat di Twitch nell'altra (la chat si nasconde con &chat=0) -->
      <div class="statusRow">
        <div id="ring" class="ring">
          <svg viewBox="0 0 100 100"><circle class="ringBg" cx="50" cy="50" r="44"/><circle id="ringFill" class="ringFill" cx="50" cy="50" r="44" pathLength="100"/></svg>
          <div id="timer" class="timer"></div>
        </div>
        <div id="chatBox" class="chatBox" hidden>
          <div id="chatList" class="chatList"></div>
        </div>
      </div>

      <div id="thought" class="thought" hidden><div class="thoughtHead" id="thoughtHead"></div><div class="thoughtView" id="thoughtView"><div class="thoughtText" id="thoughtText"></div></div></div>
      <div id="top" class="top"></div>
      <div id="rest" class="rest"></div>
      <div id="hist" class="hist" hidden></div>

      <div class="foot">
        <div class="how" id="how"></div>
        <div class="legend" id="legend"></div>
        <div class="meta"><span id="votes"></span><span id="chatState" class="chatState"></span></div>
      </div>
    </div>
  </div>
  <script type="module" src="/overlay.js"></script>
</body>
</html>
